<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

    <div class="container">

        <div class="row justify-content-center align-items-center vh-100">

            <div class="col-md-5">

                <div class="card shadow-lg p-5">

                    <h2 class="text-center mb-4">

                        🔐 Login

                    </h2>

                    <input id="email" class="form-control mb-3" placeholder="Email">

                    <input id="password" type="password" class="form-control mb-4" placeholder="Password">

                    <button class="btn btn-primary w-100" onclick="loginUser()">

                        Login

                    </button>

                    <div class="text-center mt-4">

                        Don't have an account?

                        <a href="/register-page">

                            Register

                        </a>

                    </div>

                    <div class="text-center mt-3">

                        <a href="/">← Back Home</a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="/static/js/app.js"></script>

</body>

</html>
