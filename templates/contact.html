<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">📚 Book Manager</a>

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/services">Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/contact">Contact</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                </li>

            </ul>

        </div>

    </nav>



    <section class="container py-5">

        <div class="row">

            <div class="col-lg-6">

                <h1 class="fw-bold mb-4">

                    Contact Us

                </h1>

                <p>

                    Have questions?

                    Feel free to contact us using the form.

                    Your message will be stored securely in our database.

                </p>

                <img src="/static/images/hero.jpg" class="img-fluid rounded shadow">

            </div>


            <div class="col-lg-6">

                <div class="card shadow-lg p-4">

                    <h3 class="text-center mb-4">

                        Send Message

                    </h3>

                    <input id="contactName" class="form-control mb-3" placeholder="Your Name">

                    <input id="contactEmail" class="form-control mb-3" placeholder="Your Email">

                    <input id="contactSubject" class="form-control mb-3" placeholder="Subject">

                    <textarea id="contactMessage" class="form-control mb-3" rows="5"
                        placeholder="Write your message"></textarea>

                    <button class="btn btn-success w-100" onclick="sendContact()">

                        Send Message

                    </button>

                </div>

            </div>

        </div>

    </section>



    <footer>

        <div class="container text-center">

            <h5>

                Book Management System

            </h5>

            <p>

                FastAPI • JWT • SQLite

            </p>

        </div>

    </footer>

    <script src="/static/js/app.js"></script>

</body>

</html>
